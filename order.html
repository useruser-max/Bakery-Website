<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 
        Student Name: Simra Hanif
        Student ID: 040
        Page: Order
        Description: Order page for The Hidden Cup Bakery website
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order - The Hidden Cup Bakery</title>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: #5a3d2b;
            background-image: url('images\\bakerywall.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 249, 250, 0.85);
            z-index: -1;
        }

        header {
            background: rgba(255, 209, 220, 0.9);
            text-align: center;
            padding: 2rem 1rem;
            backdrop-filter: blur(5px);
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ffb6c1;
        }

        h1 {
            color: #d35d6e;
            margin: 1rem 0 0.5rem;
        }

        nav {
            background: rgba(255, 228, 225, 0.9);
            padding: 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: #d35d6e;
            font-weight: bold;
        }

        nav a:hover {
            color: #a04553;
        }

        main {
            max-width: 800px;
            margin: 2rem auto;
            background: rgba(255, 240, 245, 0.9);
            padding: 2rem;
            border-radius: 8px;
            backdrop-filter: blur(3px);
        }

        h2 {
            color: #d35d6e;
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-top: 1rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.6rem;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 1.5rem;
            background-color: #d35d6e;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #a04553;
        }

        footer {
            background: rgba(211, 93, 110, 0.9);
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
            backdrop-filter: blur(5px);
        }

        @media (max-width: 768px) {
            nav a {
                display: block;
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <img src="images/bakerylogo.jpg" alt="The Hidden Cup Bakery Logo" class="logo">
        <h1>The Hidden Cup Bakery</h1>
        <p>Place your order with ease!</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About us</a>
        <a href="order.html">Order</a>
        <a href="customcake.html">Custom Cake</a>
        <a href="Food Gallery.html">Food Gallery</a>
        <a href="booking info.html">Booking</a>
        <a href="Reviews.html">Reviews</a>
        <a href="FAQ.html">FAQ</a>
        <a href="Contact info.html">Contact Us</a>
    </nav>

    <!-- Main Content -->
    <main>
        <h2>Order Form</h2>
        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" required>

            <label for="items">Select Item:</label>
            <select id="items">
                <option value="Croissant">Croissant - Rs.300</option>
                <option value="Eclair">Chocolate Eclair - Rs.350</option>
                <option value="Sourdough">Sourdough Bread - Rs.500</option>
                <option value="RedVelvet">Red Velvet Cake - Rs.450</option>
            </select>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" value="1" min="1">

            <label for="instructions">Special Instructions:</label>
            <textarea id="instructions" rows="3"></textarea>

            <button type="submit">Place Order</button>
        </form>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2023 The Hidden Cup Bakery | 123 Baker Street, Karachi | (021) 123-4567</p>
        <p>Open daily 7am-7pm | Follow us on <a href="#">Instagram</a> and <a href="#">Facebook</a></p>
    </footer>

</body>
</html>
